<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTel Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-blue-800 text-white px-6 py-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">OTel Bank</h1>
        <p class="text-blue-300 text-xs mt-0.5">OpenTelemetry observability demo</p>
      </div>
      <span id="refresh-indicator" class="text-xs text-blue-400"></span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8 space-y-8">

    <!-- Accounts -->
    <section>
      <h2 class="text-lg font-semibold text-slate-700 mb-3">Accounts</h2>
      <div id="accounts" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
    </section>

    <!-- Transfer form -->
    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-semibold text-slate-700 mb-4">New Transfer</h2>
      <form id="transfer-form" class="flex flex-wrap gap-3 items-end">
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-500 font-medium">From</label>
          <select id="from_account" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-500 font-medium">To</label>
          <select id="to_account" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-500 font-medium">Amount ($)</label>
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"
            class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit"
          class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
          Transfer
        </button>
        <span id="transfer-msg" class="text-sm"></span>
      </form>
    </section>

    <!-- Transactions -->
    <section>
      <h2 class="text-lg font-semibold text-slate-700 mb-3">Recent Transactions</h2>
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
            <tr>
              <th class="px-4 py-3 text-left">From</th>
              <th class="px-4 py-3 text-left">To</th>
              <th class="px-4 py-3 text-right">Amount</th>
              <th class="px-4 py-3 text-center">Status</th>
              <th class="px-4 py-3 text-right">Time</th>
            </tr>
          </thead>
          <tbody id="transactions" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="no-transactions" class="text-center text-slate-400 text-sm py-8 hidden">No transactions yet.</p>
      </div>
    </section>

  </main>

  <script>
    const STATUS_BADGE = {
      pending:   'bg-yellow-100 text-yellow-700',
      completed: 'bg-green-100  text-green-700',
      failed:    'bg-red-100    text-red-700',
    };

    let accountData = [];

    async function loadAccounts() {
      const res = await fetch('/api/accounts');
      accountData = await res.json();

      const container = document.getElementById('accounts');
      container.innerHTML = accountData.map(a => `
        <div class="bg-white rounded-xl shadow-sm p-4">
          <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">${a.id}</p>
          <p class="text-slate-800 font-semibold mt-0.5">${a.name}</p>
          <p class="text-2xl font-bold text-blue-700 mt-2">$${a.balance.toFixed(2)}</p>
        </div>
      `).join('');

      // Populate selects
      ['from_account', 'to_account'].forEach(id => {
        const sel = document.getElementById(id);
        const cur = sel.value;
        sel.innerHTML = accountData.map(a => `<option value="${a.id}">${a.name} (${a.id})</option>`).join('');
        if (cur) sel.value = cur;
      });
      if (accountData.length > 1) document.getElementById('to_account').value = accountData[1].id;
    }

    async function loadTransactions() {
      const res = await fetch('/api/transactions');
      const txs = await res.json();
      const tbody = document.getElementById('transactions');
      const empty = document.getElementById('no-transactions');

      if (txs.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      tbody.innerHTML = txs.map(t => `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3">${t.from_name}</td>
          <td class="px-4 py-3">${t.to_name}</td>
          <td class="px-4 py-3 text-right font-medium">$${t.amount.toFixed(2)}</td>
          <td class="px-4 py-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${STATUS_BADGE[t.status] || ''}">${t.status}</span>
          </td>
          <td class="px-4 py-3 text-right text-slate-400 text-xs">${t.created_at}</td>
        </tr>
      `).join('');
    }

    document.getElementById('transfer-form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('transfer-msg');
      msg.textContent = '';

      const body = {
        from_account: document.getElementById('from_account').value,
        to_account:   document.getElementById('to_account').value,
        amount:       parseFloat(document.getElementById('amount').value),
      };

      const res = await fetch('/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (res.ok) {
        msg.className = 'text-sm text-green-600';
        msg.textContent = `Queued (tx #${data.tx_id})`;
        document.getElementById('amount').value = '';
        await loadTransactions();
      } else {
        msg.className = 'text-sm text-red-600';
        msg.textContent = data.error;
      }
    });

    async function refresh() {
      await Promise.all([loadAccounts(), loadTransactions()]);
      document.getElementById('refresh-indicator').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
